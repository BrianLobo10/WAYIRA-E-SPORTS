<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>WAYIRA E-SPORTS</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="WAYIRA E-SPORTS — Torneos, comunidad y League of Legends en La Guajira, Colombia.">
  <meta name="theme-color" content="#121211">
  <meta name="color-scheme" content="dark">
  <!-- Colores elegidos por el Superadmin: se aplican antes de pintar (el hash de este script está en la CSP de firebase.json) -->
  <script>(function(){var r=document.documentElement;try{var f=localStorage.getItem('wayira-theme-fonts');if(f&&/^https:\/\/fonts\.googleapis\.com\/css2\?[A-Za-z0-9+:@;,.&=_-]{1,1500}$/.test(f)){var l=document.createElement('link');l.rel='stylesheet';l.id='theme-fonts';l.href=f;document.head.appendChild(l);}var v=JSON.parse(localStorage.getItem('wayira-theme-vars')||'null');if(v&&typeof v==='object'){for(var k in v){if(/^--[a-z0-9-]+$/.test(k)&&typeof v[k]==='string'&&/^[^{};<]{1,160}$/.test(v[k]))r.style.setProperty(k,v[k]);}if(v['--bg']){var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',v['--bg']);}return;}}catch(e){}r.classList.add('theme-pending');setTimeout(function(){r.classList.remove('theme-pending');},1500);})();</script>
  <style>html.theme-pending body{visibility:hidden}</style>
  <link rel="icon" type="image/png" sizes="32x32" href="brand/favicon-32.png">
  <link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Rajdhani:wght@600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons&display=block">
</head>
<body>
  <app-root></app-root>
</body>
</html>
