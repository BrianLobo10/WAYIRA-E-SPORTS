<section class="community" id="community">
  <div class="community__container">
    <div class="community__grid">
      <div class="community__left anim-fade-up">
        <p class="community__eyebrow">La Familia WAYIRA</p>
        <h2 class="community__headline">
          <span>MÁS QUE UN EQUIPO.</span>
          <span class="community__headline-accent">UNA COMUNIDAD.</span>
        </h2>
        <p class="community__desc">
          Discord, Twitch y redes sociales conectan jugadores de La Guajira con toda Colombia. Entra, compite y crece con nosotros.
        </p>
        <div class="community__ctas">
          <button type="button" class="btn btn-primary" (click)="goToDiscord()">
            <span class="material-icons" aria-hidden="true">forum</span>
            Unirse al Discord
          </button>
          <button type="button" class="btn btn-secondary" (click)="goToTwitch()">
            <span class="material-icons" aria-hidden="true">live_tv</span>
            Seguirnos en Twitch
          </button>
        </div>
      </div>

      <div class="community__cards anim-fade-up anim-d2">
        @for (card of socialCards; track card.name) {
          <button type="button" class="social-row" [class]="'social-row--' + card.theme" (click)="card.action()">
            <span class="social-row__icon-box" [class]="'social-row__icon-box--' + card.theme">
              <span class="material-icons" aria-hidden="true">{{ card.icon }}</span>
            </span>
            <span class="social-row__name">{{ card.name }}</span>
            <span class="material-icons social-row__chev" aria-hidden="true">chevron_right</span>
          </button>
        }
      </div>
    </div>
  </div>
</section>
