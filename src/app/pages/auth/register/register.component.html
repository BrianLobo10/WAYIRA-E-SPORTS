<div class="register-page">
  <div class="register-card">
    <a routerLink="/" class="auth-brand" aria-label="WAYIRA E-SPORTS, inicio">
      <picture>
        <source type="image/avif" srcset="brand/logo-112.avif">
        <source type="image/webp" srcset="brand/logo-112.webp">
        <img referrerpolicy="no-referrer" src="brand/logo-112.png" alt="" width="48" height="48" decoding="async">
      </picture>
    </a>
    <h1 class="register-title">Crea tu <span class="mark">cuenta</span>.</h1>
    <p class="register-subtitle">Regístrate con Discord o con Google. Tu perfil se crea automáticamente.</p>

    <div class="register-form">
      <app-social-auth-buttons verb="Registrarme" returnPath="/profile" />
    </div>

    <p class="register-footer">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
    </p>
  </div>
</div>
