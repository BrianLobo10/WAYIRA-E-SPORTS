<div class="login-page">
  <div class="login-card">
    <h1 class="login-title">Iniciar sesión</h1>
    <p class="login-subtitle">Ingresa con Google o con tu teléfono</p>

    <div class="login-form">
      @if (error()) {
        <div class="error-message">{{ error() }}</div>
      }

      <div class="social-buttons">
        <button type="button" class="btn-social btn-google" (click)="onLoginWithGoogle()" [disabled]="loadingSocial()">
          @if (loadingSocial()) {
            <span class="spinner"></span>
          } @else {
            <svg class="social-icon" viewBox="0 0 24 24" width="20" height="20">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
          }
          <span>Google</span>
        </button>
      </div>

      <div class="login-divider">
        <span>o con teléfono</span>
      </div>

      <div id="recaptcha-phone-container"></div>

      @if (!codeSent()) {
        <div class="form-group">
          <label for="phone">Número de teléfono (ej. +51 999 123 456)</label>
          <input id="phone" type="tel" class="form-input" placeholder="+51999123456"
                 [ngModel]="phone()" (ngModelChange)="phone.set($event)" [disabled]="loadingPhone()" />
        </div>
        <button type="button" class="btn-submit" (click)="onSendCode()" [disabled]="loadingPhone() || !phone().trim()">
          @if (loadingPhone()) {
            <span class="spinner"></span> Enviar código
          } @else {
            Enviar código SMS
          }
        </button>
      } @else {
        <div class="form-group">
          <label for="code">Código de verificación</label>
          <input id="code" type="text" class="form-input" placeholder="123456" inputmode="numeric" maxlength="6"
                 [ngModel]="verificationCode()" (ngModelChange)="verificationCode.set($event)" [disabled]="loadingVerify()" />
        </div>
        <button type="button" class="btn-submit" (click)="onVerifyCode()" [disabled]="loadingVerify() || verificationCode().length < 6">
          @if (loadingVerify()) {
            <span class="spinner"></span> Verificando...
          } @else {
            Verificar y entrar
          }
        </button>
        <button type="button" class="btn-link" (click)="codeSent.set(false); error.set('')">Usar otro número</button>
      }

      <label class="remember-me">
        <input type="checkbox" class="checkbox-input" [ngModel]="rememberMe()" (ngModelChange)="rememberMe.set($event)" />
        <span>Recordarme (mantener sesión abierta)</span>
      </label>
    </div>

    <p class="login-footer">
      ¿No tienes cuenta? <a routerLink="/register">Regístrate</a>
    </p>
  </div>
</div>
