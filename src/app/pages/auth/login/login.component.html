<div class="login-page">
  <div class="login-card">
    <a routerLink="/" class="auth-brand" aria-label="WAYIRA E-SPORTS, inicio">
      <picture>
        <source type="image/avif" srcset="brand/logo-112.avif">
        <source type="image/webp" srcset="brand/logo-112.webp">
        <img referrerpolicy="no-referrer" src="brand/logo-112.png" alt="" width="48" height="48" decoding="async">
      </picture>
    </a>
    <h1 class="login-title">Entra a <span class="mark">Wayira</span>.</h1>
    <p class="login-subtitle">Entra con Discord o Google. ¿Primera vez? Tu perfil se crea solo.</p>

    <div class="login-form">
      <app-social-auth-buttons verb="Entrar" [returnPath]="returnPath" [initialError]="providerError" />
    </div>

    <p class="login-footer">
      No publicamos nada en tus cuentas ni pedimos tu contraseña.
    </p>
  </div>
</div>
